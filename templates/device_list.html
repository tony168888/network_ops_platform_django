{% extends "base.html" %}

{% block title %}设备管理{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3 class="card-title">设备列表</h3>
    </div>
    <div class="table-responsive">
        <table class="table card-table table-vcenter">
            <thead>
                <tr>
                    <th>设备名称</th>
                    <th>管理IP</th>
                    <th>厂商</th>
                    <th>状态</th>
                </tr>
            </thead>
            <tbody>
                {% for d in devices %}
                <tr>
                    <td>{{ d.name }}</td>
                    <td>{{ d.ip }}</td>
                    <td>{{ d.vendor }}</td>
                    <td>
                        {% if d.status == 'online' %}
                        <span class="badge bg-green">在线</span>
                        {% else %}
                        <span class="badge bg-red">离线</span>
                        {% endif %}
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="4" class="text-center">暂无数据</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
