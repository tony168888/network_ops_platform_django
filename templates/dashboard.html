{% extends "base.html" %}

{% block title %}首页 - 运维平台{% endblock %}

{% block content %}
<div class="row row-cards">
    <div class="col-sm-6 col-lg-3">
        <div class="card card-sm">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-auto">
                        <span class="bg-primary text-white avatar">🖥️</span>
                    </div>
                    <div class="col">
                        <div class="font-weight-medium">设备总数</div>
                        <div class="h1 mb-0">{{ total }}</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-lg-3">
        <div class="card card-sm">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-auto">
                        <span class="bg-green text-white avatar">✅</span>
                    </div>
                    <div class="col">
                        <div class="font-weight-medium">在线设备</div>
                        <div class="h1 mb-0">{{ online }}</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
